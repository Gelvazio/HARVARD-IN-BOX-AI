<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HARVARD-IN-BOX-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-header p {
      color: #64748b;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e293b;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .remember-me {
      display: flex;
      gap: 6px;
    }
    .remember-me input {
      width: auto;
      margin: 0;
    }
    .forgot-password {
      color: #667eea;
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-password:hover {
      color: #5568d3;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
    }
    .auth-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .error-message {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background: #dcfce7;
      border-left: 4px solid #10b981;
      color: #065f46;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>🎓 HARVARD-IN-BOX</h1>
      <p>Bem-vindo de volta!</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox" name="rememberMe" />
          <span>Lembrar-me</span>
        </label>
        <a href="/pages/reset-password.html" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn" id="submitBtn">Entrar</button>
    </form>

    <div class="auth-footer">
      Não tem conta? <a href="/pages/signup.html">Cadastre-se aqui</a>
    </div>
  </div>

  <script type="module">
    import { createSupabaseClient } from '../src/services/supabase-client.js';
    import { createAuthService } from '../src/services/auth-service.js';

    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    let authService = null;

    // Initialize auth service
    async function initAuth() {
      try {
        const supabase = createSupabaseClient();
        authService = createAuthService(supabase);
      } catch (error) {
        showError('Erro ao inicializar autenticação: ' + error.message);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Por favor, preencha todos os campos');
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '';
      const spinner = document.createElement('div');
      spinner.className = 'loading';
      submitBtn.appendChild(spinner);

      try {
        await authService.signIn(email, password);

        showSuccess('Login realizado com sucesso! Redirecionando...');

        // Redirecionar após 1.5 segundos
        setTimeout(() => {
          const redirectUrl = new URLSearchParams(window.location.search).get('redirect');
          window.location.href = redirectUrl || '/pages/dashboard.html';
        }, 1500);
      } catch (error) {
        showError(error.message || 'Erro ao fazer login');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
    }

    window.addEventListener('load', initAuth);
  </script>
</body>
</html>
