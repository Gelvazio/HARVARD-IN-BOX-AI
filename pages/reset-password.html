<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - HARVARD-IN-BOX-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-header p {
      color: #64748b;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e293b;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
    }
    .auth-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .error-message {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background: #dcfce7;
      border-left: 4px solid #10b981;
      color: #065f46;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
    }
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>🔐 Recuperar Senha</h1>
      <p>Vamos ajudá-lo a recuperar sua conta</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <!-- Step 1: Email -->
    <form id="resetForm" class="form-step active">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
        />
      </div>

      <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">
        Enviaremos um link de recuperação para este email.
      </p>

      <button type="submit" class="btn" id="submitBtn">Enviar Link de Recuperação</button>
    </form>

    <!-- Step 2: New Password -->
    <form id="newPasswordForm" class="form-step">
      <div class="form-group">
        <label for="newPassword">Nova Senha</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirmar Senha</label>
        <input
          type="password"
          id="confirmNewPassword"
          name="confirmNewPassword"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn" id="updatePasswordBtn">Atualizar Senha</button>
    </form>

    <div class="auth-footer">
      <a href="/pages/login.html">← Voltar ao login</a>
    </div>
  </div>

  <script type="module">
    import { createSupabaseClient } from '../src/services/supabase-client.js';
    import { createAuthService } from '../src/services/auth-service.js';

    const resetForm = document.getElementById('resetForm');
    const newPasswordForm = document.getElementById('newPasswordForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    let authService = null;
    const urlParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = urlParams.get('access_token');
    const type = urlParams.get('type');

    // Initialize auth service
    async function initAuth() {
      try {
        const supabase = createSupabaseClient();
        authService = createAuthService(supabase);

        // Se tem token (voltando do email), mostrar form de nova senha
        if (accessToken && type === 'recovery') {
          showPasswordForm();
        }
      } catch (error) {
        showError('Erro ao inicializar: ' + error.message);
      }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();

      if (!email) {
        showError('Por favor, insira seu email');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '';
      const spinner = document.createElement('div');
      spinner.className = 'loading';
      submitBtn.appendChild(spinner);

      try {
        await authService.resetPassword(email);
        showSuccess('Email de recuperação enviado! Verifique sua caixa de entrada.');

        resetForm.reset();

        setTimeout(() => {
          window.location.href = '/pages/login.html';
        }, 3000);
      } catch (error) {
        showError(error.message || 'Erro ao enviar email de recuperação');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    newPasswordForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (!newPassword || !confirmNewPassword) {
        showError('Por favor, preencha todos os campos');
        return;
      }

      if (newPassword !== confirmNewPassword) {
        showError('As senhas não conferem');
        return;
      }

      if (newPassword.length < 6) {
        showError('A senha deve ter no mínimo 6 caracteres');
        return;
      }

      const updateBtn = document.getElementById('updatePasswordBtn');
      updateBtn.disabled = true;
      const originalText = updateBtn.textContent;
      updateBtn.textContent = '';
      const spinner = document.createElement('div');
      spinner.className = 'loading';
      updateBtn.appendChild(spinner);

      try {
        await authService.updatePassword(newPassword);
        showSuccess('Senha atualizada com sucesso! Redirecionando para login...');

        setTimeout(() => {
          window.location.href = '/pages/login.html';
        }, 2000);
      } catch (error) {
        showError(error.message || 'Erro ao atualizar senha');
        updateBtn.disabled = false;
        updateBtn.textContent = originalText;
      }
    });

    function showPasswordForm() {
      resetForm.classList.remove('active');
      newPasswordForm.classList.add('active');
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
    }

    window.addEventListener('load', initAuth);
  </script>
</body>
</html>
