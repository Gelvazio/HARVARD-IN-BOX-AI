<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - HARVARD-IN-BOX-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-header p {
      color: #64748b;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1e293b;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    .strength-bar {
      flex: 1;
      height: 3px;
      background: #e2e8f0;
      border-radius: 2px;
    }
    .strength-bar.weak { background: #ef4444; }
    .strength-bar.medium { background: #eab308; }
    .strength-bar.strong { background: #10b981; }
    .strength-text {
      font-size: 11px;
      margin-top: 4px;
      color: #64748b;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 14px;
    }
    .auth-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .terms-checkbox {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .terms-checkbox input {
      width: auto;
      margin: 0;
    }
    .error-message {
      background: #fee2e2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background: #dcfce7;
      border-left: 4px solid #10b981;
      color: #065f46;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>🎓 HARVARD-IN-BOX</h1>
      <p>Comece sua jornada de aprendizado</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="fullName">Nome Completo</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Seu nome completo"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
        />
        <div class="password-strength" id="passwordStrength"></div>
        <div class="strength-text" id="strengthText"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="terms-checkbox">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms" style="margin-bottom: 0;">
          Concordo com os <a href="#" style="color: #667eea;">Termos de Serviço</a>
        </label>
      </div>

      <button type="submit" class="btn" id="submitBtn">Criar Conta</button>
    </form>

    <div class="auth-footer">
      Já tem conta? <a href="/pages/login.html">Faça login aqui</a>
    </div>
  </div>

  <script type="module">
    import { createSupabaseClient } from '../src/services/supabase-client.js';
    import { createAuthService } from '../src/services/auth-service.js';

    const form = document.getElementById('signupForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const strengthDiv = document.getElementById('passwordStrength');
    const strengthText = document.getElementById('strengthText');

    let authService = null;

    // Initialize auth service
    async function initAuth() {
      try {
        const supabase = createSupabaseClient();
        authService = createAuthService(supabase);
      } catch (error) {
        showError('Erro ao inicializar autenticação: ' + error.message);
      }
    }

    // Password strength indicator
    passwordInput.addEventListener('input', (e) => {
      const password = e.target.value;
      const strength = calculatePasswordStrength(password);

      updateStrengthIndicator(strength);
    });

    function calculatePasswordStrength(password) {
      if (password.length < 6) return 'weak';
      if (password.length < 10 || !/[A-Z]/.test(password) || !/[0-9]/.test(password))
        return 'medium';
      return 'strong';
    }

    function updateStrengthIndicator(strength) {
      strengthDiv.innerHTML = '';

      const bars = strength === 'weak' ? 1 : strength === 'medium' ? 2 : 3;
      for (let i = 0; i < 3; i++) {
        const bar = document.createElement('div');
        bar.className = 'strength-bar';
        if (i < bars) {
          bar.classList.add(strength);
        }

        strengthDiv.appendChild(bar);
      }

      const texts = { weak: 'Fraca', medium: 'Média', strong: 'Forte' };
      strengthText.textContent = `Força da senha: ${texts[strength]}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!fullName || !email || !password || !confirmPassword) {
        showError('Por favor, preencha todos os campos');
        return;
      }

      if (password !== confirmPassword) {
        showError('As senhas não conferem');
        return;
      }

      if (password.length < 6) {
        showError('A senha deve ter no mínimo 6 caracteres');
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '';
      const spinner = document.createElement('div');
      spinner.className = 'loading';
      submitBtn.appendChild(spinner);

      try {
        await authService.signUp(email, password, fullName);

        showSuccess('Cadastro realizado com sucesso! Verifique seu email para confirmar.');

        // Limpar form
        form.reset();
        strengthDiv.innerHTML = '';
        strengthText.textContent = '';

        // Redirecionar após 3 segundos
        setTimeout(() => {
          window.location.href = '/pages/login.html';
        }, 3000);
      } catch (error) {
        showError(error.message || 'Erro ao criar conta');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
    }

    window.addEventListener('load', initAuth);
  </script>
</body>
</html>
