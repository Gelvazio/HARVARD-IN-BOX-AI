<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessão de Estudo - HARVARD-IN-BOX-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 700px;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 16px 16px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .header-info {
      font-size: 12px;
      opacity: 0.9;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }
    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.student {
      justify-content: flex-end;
    }
    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
    }
    .tutor .message-content {
      background: white;
      color: #1e293b;
      border-left: 3px solid #667eea;
    }
    .student .message-content {
      background: #667eea;
      color: white;
      border-radius: 12px;
    }
    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .tutor .message-avatar {
      background: #dbeafe;
      color: #667eea;
    }
    .student .message-avatar {
      background: #667eea;
      color: white;
    }
    .input-area {
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 12px;
      background: white;
      border-radius: 0 0 16px 16px;
    }
    .input-group {
      flex: 1;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      padding: 10px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 14px;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      background: #cbd5e1;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }
    .sidebar {
      width: 250px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 13px;
    }
    .sidebar-title {
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .sidebar-item {
      color: #64748b;
      margin-bottom: 6px;
      padding: 4px;
    }
    .progress-badge {
      display: inline-block;
      background: #dbeafe;
      color: #667eea;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    @media (max-width: 640px) {
      .container {
        border-radius: 12px;
        max-height: calc(100vh - 40px);
      }
      .message-content {
        max-width: 90%;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🎓 Sessão de Tutoria</h1>
        <div class="header-info">Aprenda através do diálogo Socrático</div>
      </div>
      <span class="progress-badge">Entendimento: <span id="understanding">0</span>%</span>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
      <div class="input-group">
        <input
          type="text"
          id="userInput"
          placeholder="Escreva sua resposta e pressione Enter..."
          autocomplete="off"
        />
        <button id="sendBtn">Enviar</button>
      </div>
      <button id="endSessionBtn" style="background: #ef4444;">Encerrar</button>
    </div>
  </div>

  <script type="module">
    import { TutorDiagnostic } from '../src/roles/tutor-diagnostic.js';
    import { createAIRouter } from '../src/services/ai-router.js';

    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const endSessionBtn = document.getElementById('endSessionBtn');
    const understandingBadge = document.getElementById('understanding');

    let tutor = null;
    let isLoading = false;

    // Initialize tutor
    async function initTutor() {
      const aiRouter = createAIRouter(); // Usar configurações do projeto
      const courseContext = {
        topic: new URLSearchParams(window.location.search).get('topic') || 'Geral',
        level: new URLSearchParams(window.location.search).get('level') || 'Iniciante',
      };

      tutor = new TutorDiagnostic(aiRouter, courseContext);

      // Start first question
      const firstQuestion = await tutor.startTutoringSession(courseContext.topic, courseContext.level);
      addMessageToChat(firstQuestion, 'tutor');
    }

    function addMessageToChat(content, role) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = role === 'tutor' ? '🎓' : '👤';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.textContent = content;

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(contentDiv);

      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message tutor';
      messageDiv.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = '🎓';

      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing-indicator';
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'typing-dot';
        typingDiv.appendChild(dot);
      }

      messageDiv.appendChild(avatar);
      messageDiv.appendChild(typingDiv);

      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
    }

    async function handleSendMessage() {
      const message = userInput.value.trim();
      if (!message || isLoading) return;

      isLoading = true;
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      // Add user message
      addMessageToChat(message, 'student');

      // Show typing indicator
      showTypingIndicator();

      try {
        // Get tutor response
        const response = await tutor.askQuestion(message);

        removeTypingIndicator();
        addMessageToChat(response.message, 'tutor');

        // Update understanding
        understandingBadge.textContent = Math.round(response.studentModel.understanding * 100);
      } catch (error) {
        console.error('Erro na tutoria:', error);
        removeTypingIndicator();
        addMessageToChat('Desculpe, ocorreu um erro. Tente novamente.', 'tutor');
      } finally {
        isLoading = false;
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });

    endSessionBtn.addEventListener('click', () => {
      if (confirm('Deseja encerrar a sessão?')) {
        window.location.href = '/pages/dashboard.html';
      }
    });

    // Initialize on load
    window.addEventListener('load', initTutor);
  </script>
</body>
</html>
