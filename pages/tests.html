<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testes - HARVARD-IN-BOX-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #60a5fa;
    }
    .test-suite {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #3b82f6;
    }
    .test-suite h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #93c5fd;
    }
    .test-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      margin-bottom: 10px;
      background: #0f172a;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }
    .test-status {
      font-weight: bold;
      min-width: 30px;
    }
    .test-running {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: #475569;
      color: white;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .summary {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-top: 30px;
      text-align: center;
    }
    .summary-stat {
      display: inline-block;
      margin: 0 20px;
      font-size: 18px;
    }
    .passed { color: #10b981; }
    .failed { color: #ef4444; }
    .total { color: #93c5fd; }
    .console-output {
      background: #0f172a;
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #a1f3ae;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧪 Testes - HARVARD-IN-BOX-AI</h1>
      <p>Validação completa do sistema</p>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="runAllBtn">▶ Executar Todos</button>
      <button class="btn btn-secondary" id="runAdvisorBtn">▶ Advisor</button>
      <button class="btn btn-secondary" id="runTutorBtn">▶ Tutor</button>
      <button class="btn btn-secondary" id="runAuthBtn">▶ Auth</button>
      <button class="btn btn-secondary" id="runIntegrationBtn">▶ Integração</button>
    </div>

    <div id="testSuites"></div>

    <div class="summary">
      <div class="summary-stat passed">✅ Passaram: <span id="passCount">0</span></div>
      <div class="summary-stat failed">❌ Falharam: <span id="failCount">0</span></div>
      <div class="summary-stat total">📊 Total: <span id="totalCount">0</span></div>
    </div>

    <div class="console-output" id="consoleOutput"></div>
  </div>

  <script type="module">
    import { AdvisorTests } from '../src/tests/advisor.test.js';
    import { IntegrationTests } from '../src/tests/integration.test.js';
    import { TutorTests } from '../src/tests/tutor.test.js';
    import { AuthTests } from '../src/tests/auth.test.js';

    const consoleOutput = document.getElementById('consoleOutput');
    const testSuitesContainer = document.getElementById('testSuites');

    // Override console.log para capturar output
    const originalLog = console.log;
    console.log = function (...args) {
      consoleOutput.textContent += args.join(' ') + '\n';
      consoleOutput.scrollTop = consoleOutput.scrollHeight;
      originalLog.apply(console, args);
    };

    async function runTests(testClass, suiteName) {
      consoleOutput.textContent = '';
      testSuitesContainer.innerHTML = '';

      const suite = document.createElement('div');
      suite.className = 'test-suite';

      const title = document.createElement('h2');
      title.textContent = suiteName;
      suite.appendChild(title);

      testSuitesContainer.appendChild(suite);

      const tester = new testClass();
      const results = await tester.runAllTests();

      // Update summary
      document.getElementById('passCount').textContent = results.passed;
      document.getElementById('failCount').textContent = results.failed;
      document.getElementById('totalCount').textContent = results.passed + results.failed;

      // Display test items
      results.tests.forEach((test) => {
        const item = document.createElement('div');
        item.className = 'test-item';
        item.textContent = `${test.status} ${test.name}`;
        if (test.error) {
          item.textContent += ` - ${test.error}`;
        }
        suite.appendChild(item);
      });

      return results;
    }

    document.getElementById('runAdvisorBtn').addEventListener('click', () => {
      runTests(AdvisorTests, '🎯 Testes Advisor');
    });

    document.getElementById('runTutorBtn').addEventListener('click', () => {
      runTests(TutorTests, '🎓 Testes Tutor');
    });

    document.getElementById('runAuthBtn').addEventListener('click', () => {
      runTests(AuthTests, '🔐 Testes Autenticação');
    });

    document.getElementById('runIntegrationBtn').addEventListener('click', () => {
      runTests(IntegrationTests, '🔗 Testes de Integração');
    });

    document.getElementById('runAllBtn').addEventListener('click', async () => {
      await runTests(AdvisorTests, '🎯 Testes Advisor');
      await runTests(TutorTests, '🎓 Testes Tutor');
      await runTests(AuthTests, '🔐 Testes Autenticação');
      await runTests(IntegrationTests, '🔗 Testes de Integração');
    });

    // Execute todos os testes ao carregar a página
    window.addEventListener('load', () => {
      document.getElementById('runAllBtn').click();
    });
  </script>
</body>
</html>
